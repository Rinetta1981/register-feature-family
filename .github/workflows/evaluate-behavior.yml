name: Evaluate Frozen Behavioral Gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Run frozen three-seed behavioral evaluation
        run: |
          python scripts/evaluate_behavioral_gate.py \
            "artifacts/behavioral-evaluation"

      - name: Show frozen behavioral gate
        run: |
          cat "artifacts/behavioral-evaluation/behavioral_gate.json"

      - name: Upload models, predictions, and metrics
        uses: actions/upload-artifact@v4
        with:
          name: frozen-behavioral-evaluation
          path: artifacts/behavioral-evaluation/
          if-no-files-found: error
          retention-days: 90
