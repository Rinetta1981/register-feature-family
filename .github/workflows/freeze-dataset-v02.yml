name: Freeze Dataset v0.2

on:
  push:
    branches:
      - model-foundation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freeze-v02:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Build and audit frozen dataset v0.2
        run: python scripts/freeze_dataset_v02.py

      - name: Show frozen v0.2 manifest
        run: cat data/frozen/v0.2/manifest.json

      - name: Upload frozen dataset v0.2
        uses: actions/upload-artifact@v4
        with:
          name: register-feature-family-dataset-v0.2
          path: data/frozen/v0.2/
          if-no-files-found: error
          retention-days: 90
