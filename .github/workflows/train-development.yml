name: Train Development Model

on:
  workflow_dispatch:
    inputs:
      seed:
        description: Model initialization seed
        required: true
        default: "0"
        type: choice
        options:
          - "0"
          - "1"
          - "2"

permissions:
  contents: read

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Train validation-only development model
        run: |
          python scripts/train_development_model.py \
            "${{ inputs.seed }}" \
            "artifacts/development-seed-${{ inputs.seed }}"

      - name: Show development metrics
        run: |
          cat "artifacts/development-seed-${{ inputs.seed }}/metrics.json"

      - name: Upload model and metrics
        uses: actions/upload-artifact@v4
        with:
          name: development-model-seed-${{ inputs.seed }}
          path: artifacts/development-seed-${{ inputs.seed }}/
          if-no-files-found: error
          retention-days: 90
